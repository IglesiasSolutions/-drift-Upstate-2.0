<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 72" role="img" aria-label="Drift Upstate Boat Tours">
  <!-- Ship wheel icon -->
  <g transform="translate(12, 36)" fill="none" stroke="#CC9B20" stroke-width="1.4">
    <!-- Outer ring -->
    <circle cx="0" cy="0" r="14" />
    <!-- Inner hub -->
    <circle cx="0" cy="0" r="4" fill="#CC9B20" stroke="none"/>
    <!-- Spokes -->
    <line x1="0" y1="-4" x2="0" y2="-14"/>
    <line x1="0" y1="4" x2="0" y2="14"/>
    <line x1="-4" y1="0" x2="-14" y2="0"/>
    <line x1="4" y1="0" x2="14" y2="0"/>
    <line x1="-2.8" y1="-2.8" x2="-9.9" y2="-9.9"/>
    <line x1="2.8" y1="2.8" x2="9.9" y2="9.9"/>
    <line x1="2.8" y1="-2.8" x2="9.9" y2="-9.9"/>
    <line x1="-2.8" y1="2.8" x2="-9.9" y2="9.9"/>
  </g>
  <!-- DRIFT wordmark -->
  <text x="34" y="30" font-family="Georgia, serif" font-size="22" font-weight="700" letter-spacing="4" fill="#E8D5B0">DRIFT</text>
  <!-- Upstate script -->
  <text x="34" y="50" font-family="Georgia, serif" font-size="16" font-style="italic" letter-spacing="1" fill="#CC9B20">Upstate</text>
  <!-- BOAT TOURS -->
  <text x="34" y="64" font-family="Arial, sans-serif" font-size="7" letter-spacing="3" fill="#E8D5B0" opacity="0.7">BOAT TOURS</text>
</svg>
